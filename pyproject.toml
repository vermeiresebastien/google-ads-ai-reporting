[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "google-ads-ai-reporting"
version = "0.1.0"
description = "AI-ready Google Ads analytical data layer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "redis>=5.2",
  "rq>=2.0",
  "cryptography>=44",
  "PyJWT>=2.10",
  "httpx>=0.28",
  "google-ads>=25.1",
  "structlog>=24.4",
  "mcp>=1.9",
  "sentry-sdk>=2.19",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
gads-api = "gads_api.main:run"
gads-sync = "gads_ingestion.cli:main"
gads-mcp = "gads_mcp.server:main"

[tool.setuptools]
packages = [
  "gads",
  "gads_api",
  "gads_api.routers",
  "gads_ingestion",
  "gads_ingestion.google_ads",
  "gads_analytics",
  "gads_mcp",
]

[tool.setuptools.package-dir]
gads = "shared/gads"
gads_api = "services/api/gads_api"
gads_ingestion = "services/ingestion/gads_ingestion"
gads_analytics = "services/analytics/gads_analytics"
gads_mcp = "services/mcp/gads_mcp"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "shared",
  "services/api",
  "services/ingestion",
  "services/analytics",
  "services/mcp",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
